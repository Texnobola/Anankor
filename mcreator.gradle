repositories {
maven {
  name = "Illusive Soulworks maven"
  url = "https://maven.theillusivec4.top/"
  }
}

dependencies {
  runtimeOnly "top.theillusivec4.curios:curios-neoforge:17.0.0-beta.3+26.3"
  compileOnly "top.theillusivec4.curios:curios-neoforge:17.0.0-beta.3+26.3:api"
}


repositories {
  exclusiveContent {
    forRepository {
      maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
      }
    }
    filter {
      includeGroupAndSubgroups('com.geckolib')
    }
  }
}

dependencies {
  implementation 'com.geckolib:geckolib-neoforge-26.3:5.5.7'
  interfaceInjectionData 'com.geckolib:geckolib-neoforge-26.3:5.5.7'
}


repositories {
  maven {
    name = "Progwml6's maven"
    url = "https://dvs1.progwml6.com/files/maven/"
  }
  maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
  }
  maven {
    name = "ModMaven"
    url = "https://modmaven.dev"
  }
}

dependencies {
    compileOnly("mezz.jei:jei-26.3-common-api:31.15.0.79")
    compileOnly("mezz.jei:jei-26.3-neoforge-api:31.15.0.79")
    runtimeOnly("mezz.jei:jei-26.3-neoforge:31.15.0.79")
}

repositories {
  maven {
    name = "RedlanceMinecraft"
    url = "https://repo.redlance.org/public"
  }
}

dependencies {
  implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${property('pal_version')}") {
    exclude group: "org.slf4j"
    exclude group: "it.unimi.dsi"
    exclude group: "io.netty"
    exclude group: "com.google.code.gson"
    exclude group: "org.joml"
  }
}

